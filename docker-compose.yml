services:
  mphqa_database:
    image: postgres:17-alpine
    container_name: mphqa_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: mphqa_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"
    volumes:
      - mphqa_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mphqa_database"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  mphqa_postgres_data:
